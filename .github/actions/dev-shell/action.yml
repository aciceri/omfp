name: Dev shell
description: >-
  The runner's disk pooled into a Btrfs /nix, Nix with the omfp Cachix cache (pushed to by pushes to master only), the
  flake's dev shell, and for Rust jobs the cargo registry and target cache.
inputs:
  cachix-auth-token:
    description: The `CACHIX_AUTH_TOKEN` secret; empty (forks) reads the cache only.
    required: false
    default: ""
  rust:
    description: Whether the job compiles Rust ("true"/"false"); then the cargo cache is restored (and saved on master).
    required: false
    default: "true"
  target-cache:
    description: >-
      Whether a Rust job keeps a cargo cache of its own, target/ included ("true"/"false"). "false", for a job whose
      builds never use target/ (cargo mutants builds in copies without it), restores the Cargo registry and git
      checkouts from the test-ts job's cache and saves nothing.
    required: false
    default: "true"
runs:
  using: composite
  steps:
    # TST-075: the dev shell (omp built from source on a cold cache, Chromium, WebKitGTK, the Rust toolchain) and a debug
    # target dir with Tauri do not fit on the runner's free disk. nothing-but-nix pools the free space and, in the
    # background, what deleting the preinstalled SDKs, browsers and Docker frees into a compressed Btrfs volume on /nix
    # (with /var/tmp/nothing-but-nix and TMPDIR on it); it must run before Nix is installed. Linux runners only: the
    # macOS runner (TST-092) has the disk.
    - uses: wimpysworld/nothing-but-nix@v12
      if: runner.os == 'Linux'
      with:
        hatchet-protocol: rampage

    # The purge deletes ~/.cargo in the background, also while cargo clones into it or after rust-cache restored it:
    # CARGO_HOME, like target/, lives on the Nix volume (rust-cache reads CARGO_HOME too).
    - name: Put target/ and CARGO_HOME on the Nix volume
      if: inputs.rust == 'true' && runner.os == 'Linux'
      shell: bash
      run: |
        mkdir -p /var/tmp/nothing-but-nix/cargo-target /var/tmp/nothing-but-nix/cargo-home target
        sudo mount --bind /var/tmp/nothing-but-nix/cargo-target target
        echo "CARGO_HOME=/var/tmp/nothing-but-nix/cargo-home" >> "$GITHUB_ENV"

    - uses: cachix/install-nix-action@v31
      with:
        github_access_token: ${{ github.token }}
        # Builds go to the Btrfs volume, not to /tmp on the small root disk. A failed download from a cache (Cachix
        # answered HTTP 500 once) builds the path instead of failing the job.
        extra_nix_config: |
          accept-flake-config = true
          build-dir = /nix/build
          fallback = true

    - name: Make the build directory (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: sudo mkdir -p /nix/build

    - uses: cachix/cachix-action@v17
      with:
        name: omfp
        authToken: ${{ inputs.cachix-auth-token }}
        # Pull requests read the cache; only pushes to master fill it.
        skipPush: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/master') }}

    - name: Build the dev shell
      shell: bash
      # Also puts the shell's Rust toolchain on PATH for rust-cache, which keys on `rustc -vV` and reads
      # `cargo metadata`; every other step still runs inside `nix develop`.
      run: |
        nix develop -c sh -c 'dirname "$(command -v cargo)" > "$RUNNER_TEMP/toolchain-bin"'
        cat "$RUNNER_TEMP/toolchain-bin" >> "$GITHUB_PATH"
        df -h / /nix

    # TST-072: keyed on the job, Cargo.lock, the Cargo.toml files, rust-toolchain.toml and `rustc -vV`; pull requests
    # restore master's cache without writing their own. Each job's cache also holds the registry and git checkouts
    # (~0.9 GB, the oh-my-pi git database of omp-rpc most of it), so a job without a target/ cache borrows test-ts's
    # (the same paths and key) instead of storing a copy of its own.
    - uses: Swatinem/rust-cache@v2
      id: rust-cache
      if: inputs.rust == 'true'
      with:
        shared-key: ${{ inputs.target-cache == 'false' && 'test-ts' || '' }}
        save-if: ${{ inputs.target-cache == 'true' && github.ref == 'refs/heads/master' }}

    # Cache telemetry in the job summary (and the log) when the job ends: whether rust-cache matched its key exactly,
    # whether the job has a cache of its own, and the sizes of target/ and CARGO_HOME (what a save on master stores
    # after rust-cache prunes them).
    - name: Report the cargo cache
      if: inputs.rust == 'true'
      uses: srz-zumix/post-run-action@v3
      with:
        post-run: |
          {
            echo "### Cargo cache: ${{ github.job }}"
            echo
            echo "| exact hit | own cache | target/ | CARGO_HOME |"
            echo "| --- | --- | --- | --- |"
            echo "| ${{ steps.rust-cache.outputs.cache-hit || 'false' }} | ${{ inputs.target-cache }} | $(du -sh target/ 2>/dev/null | cut -f1) | $(du -sh "${CARGO_HOME:-$HOME/.cargo}" 2>/dev/null | cut -f1) |"
          } | tee -a "$GITHUB_STEP_SUMMARY"
