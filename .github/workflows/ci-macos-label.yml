# TST-092: the `ci/macos` label runs CI (ci.yml) by hand on the pull request's branch, its `macos` job included; the
# pull request's later pushes run that job in their own CI runs while the label stays. ci.yml does not listen to
# `labeled` itself: a run there for any other label would cancel the running CI (one concurrency group per pull request)
# or add a skipped `required CI` check, which branch protection counts as passed.
# The run by hand is no check of the pull request: its `macos` job reports itself as the commit status
# `macOS (ci/macos)` of the branch's head, so the pull request shows that job's state.
name: CI on the macOS label

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  dispatch:
    name: run CI with the macOS job
    # A fork's token cannot start workflows, and ci.yml runs only on this repository's branches.
    if: github.event.label.name == 'ci/macos' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
