# What `just ci` runs locally, split into parallel jobs (docs/specs/06-testing.md, TST-070..TST-074). Every recipe job
# runs inside the flake's dev shell as `nix develop -c just <recipe>`; `just check-workflow` keeps this file and
# `just ci` in step. The final `required CI` job is the only status branch protection requires (TST-118).
name: CI

on:
  push:
    branches: [master]
  pull_request:
  # TST-092: what the `ci/macos` label of a pull request starts (ci-macos-label.yml), the `macos` job included.
  workflow_dispatch:

permissions:
  contents: read

# One run per branch at a time. On a pull request a new push cancels the run it supersedes. On master a running run
# always finishes (it may be the only one testing a CI change, and it fills the caches); of the pushes that arrive
# meanwhile GitHub keeps only the newest pending, and as master is linear that run tests every change before it too.
# A run by hand (the `ci/macos` label's, on the pull request's branch) has the branch's group, not the pull request's.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # TST-076: builds the Linux dev shell once (omp from source on a cold cache, ~26 min); its cachix daemon pushes it
  # (on master), and every other Linux job waits for it instead of building it again in parallel. On master it also
  # fills the shared cache of the cargo git checkouts when it misses (TST-072), before the Rust jobs restore it.
  dev-shell:
    name: dev shell
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/dev-shell
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          rust: "false"
          fill-cargo-git: "true"

  web:
    name: web bundle
    needs: dev-shell
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/dev-shell
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          rust: "false"
      - run: nix develop -c just build-web
      # Built once, served by the e2e and desktop jobs (OMFP_WEB_BUNDLE).
      - uses: actions/upload-artifact@v7
        with:
          name: web-bundle
          path: ui/packages/app/dist
          if-no-files-found: error
          retention-days: 7

  check:
    name: lint, versions, spec-trace, deny, workflow
    needs: dev-shell
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/dev-shell
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: nix develop -c just check

  test-ts:
    name: TypeScript tests, view models' coverage gate
    needs: dev-shell
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/dev-shell
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: nix develop -c just test-ts

  test-contract:
    name: contract tests (pinned omp, fake LLM)
    needs: dev-shell
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/dev-shell
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: nix develop -c just test-contract

  test-e2e:
    name: E2E (headless Chromium)
    needs: [dev-shell, web]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OMFP_WEB_BUNDLE: ${{ github.workspace }}/../web-bundle
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: web-bundle
          path: ${{ env.OMFP_WEB_BUNDLE }}
      - uses: ./.github/actions/dev-shell
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: nix develop -c just test-e2e

  test-desktop:
    name: desktop (WebKitGTK under xvfb)
    needs: [dev-shell, web]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OMFP_WEB_BUNDLE: ${{ github.workspace }}/../web-bundle
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: web-bundle
          path: ${{ env.OMFP_WEB_BUNDLE }}
      - uses: ./.github/actions/dev-shell
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: nix develop -c just test-desktop

  # TST-092: the macOS desktop (WKWebView, the menu bar item; TST-090, TST-091) and the darwin packages (ENV-041) on
  # GitHub's arm64 macOS runner, whose GUI session is logged in. On pushes to master, by hand and on pull requests
  # labeled `ci/macos` only: macOS minutes cost ten Linux minutes; its cachix daemon pushes the darwin closure (omp
  # built from source) for the next run and for Macs. Advisory: `required CI` does not wait for it. A run by hand (the
  # label's) is no check of the pull request, whose own run shows this job skipped: there the job reports itself as the
  # commit status `macOS (ci/macos)` of its commit, the pull request's head (pending, then its result).
  macos:
    name: macOS desktop and packages
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci/macos')
    needs: web
    runs-on: macos-15
    timeout-minutes: 120
    permissions:
      contents: read
      statuses: write
    env:
      OMFP_WEB_BUNDLE: ${{ github.workspace }}/../web-bundle
    steps:
      - if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: pending
        run: gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$STATE" -f context="macOS (ci/macos)" -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: web-bundle
          path: ${{ env.OMFP_WEB_BUNDLE }}
      - uses: ./.github/actions/dev-shell
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: nix develop -c just test-desktop
      - run: nix develop -c just package
      - if: always() && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ job.status == 'success' && 'success' || job.status == 'cancelled' && 'error' || 'failure' }}
        run: gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$STATE" -f context="macOS (ci/macos)" -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  package:
    name: Nix packages
    needs: dev-shell
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      # Nix builds the packages in its sandbox (no cargo cache); Cachix keeps them on master.
      - uses: ./.github/actions/dev-shell
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          rust: "false"
      - run: nix develop -c just package

  # cargo mutants builds in copies of the tree without target/, so the job borrows test-ts's cargo cache for the
  # registry and stores none of its own (TST-072).
  mutants:
    name: mutation gate (omfp-core, omfp-protocol)
    needs: dev-shell
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/dev-shell
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          target-cache: "false"
      - run: nix develop -c just mutants-gate

  # The fast Rust tests (`just test`) run here once, instrumented.
  cov:
    name: Rust tests, coverage gate
    needs: dev-shell
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/dev-shell
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: nix develop -c just cov

  # TST-118: branch protection requires this one stable status. Full mutation testing still runs above and reports
  # failures, but does not hold auto-merge on the PR critical path.
  required:
    name: required CI
    if: always()
    needs: [check, test-ts, test-contract, test-e2e, test-desktop, package, cov]
    runs-on: ubuntu-latest
    steps:
      - name: Verify blocking jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<<"$RESULTS"
