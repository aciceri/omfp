# What `just ci` runs locally, split into parallel jobs (docs/specs/06-testing.md, TST-070..TST-074). Every check runs
# inside the flake's dev shell, `nix develop -c just <recipe>`; `just check-workflow` keeps this file and `just ci` in
# step.
name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# One run per branch at a time. On a pull request a new push cancels the run it supersedes. On master a running run
# always finishes (it may be the only one testing a CI change, and it fills the caches); of the pushes that arrive
# meanwhile GitHub keeps only the newest pending, and as master is linear that run tests every change before it too.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # TST-076: builds the Linux dev shell once (omp from source on a cold cache, ~26 min); its cachix daemon pushes it
  # (on master), and every other Linux job waits for it instead of building it again in parallel.
  dev-shell:
    name: dev shell
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/dev-shell
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          rust: "false"

  web:
    name: web bundle
    needs: dev-shell
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/dev-shell
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          rust: "false"
      - run: nix develop -c just build-web
      # Built once, served by the e2e and desktop jobs (OMFP_WEB_BUNDLE).
      - uses: actions/upload-artifact@v7
        with:
          name: web-bundle
          path: ui/packages/app/dist
          if-no-files-found: error
          retention-days: 7

  check:
    name: lint, versions, spec-trace, wasm, deny, workflow
    needs: dev-shell
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/dev-shell
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: nix develop -c just check

  test:
    name: Rust tests
    needs: dev-shell
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/dev-shell
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: nix develop -c just test

  test-ts:
    name: TypeScript tests
    needs: dev-shell
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/dev-shell
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: nix develop -c just test-ts

  test-contract:
    name: contract tests (pinned omp, fake LLM)
    needs: dev-shell
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/dev-shell
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: nix develop -c just test-contract

  test-e2e:
    name: E2E (headless Chromium)
    needs: [dev-shell, web]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OMFP_WEB_BUNDLE: ${{ github.workspace }}/../web-bundle
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: web-bundle
          path: ${{ env.OMFP_WEB_BUNDLE }}
      - uses: ./.github/actions/dev-shell
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: nix develop -c just test-e2e

  test-desktop:
    name: desktop (WebKitGTK under xvfb)
    needs: [dev-shell, web]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OMFP_WEB_BUNDLE: ${{ github.workspace }}/../web-bundle
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: web-bundle
          path: ${{ env.OMFP_WEB_BUNDLE }}
      - uses: ./.github/actions/dev-shell
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: nix develop -c just test-desktop

  # TST-092: the macOS desktop (WKWebView, the menu bar item; TST-090, TST-091) and the darwin packages (ENV-041) on
  # GitHub's arm64 macOS runner, whose GUI session is logged in. On pushes to master only: macOS minutes cost ten
  # Linux minutes; its cachix daemon pushes the darwin closure (omp built from source) for the next run and for Macs.
  macos:
    name: macOS desktop and packages
    if: github.event_name == 'push'
    needs: web
    runs-on: macos-15
    timeout-minutes: 120
    env:
      OMFP_WEB_BUNDLE: ${{ github.workspace }}/../web-bundle
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: web-bundle
          path: ${{ env.OMFP_WEB_BUNDLE }}
      - uses: ./.github/actions/dev-shell
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: nix develop -c just test-desktop
      - run: nix develop -c just package

  package:
    name: Nix packages
    needs: dev-shell
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      # Nix builds the packages in its sandbox (no cargo cache); Cachix keeps them on master.
      - uses: ./.github/actions/dev-shell
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          rust: "false"
      - run: nix develop -c just package

  mutants:
    name: mutation gate (omfp-core, omfp-protocol)
    needs: dev-shell
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/dev-shell
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: nix develop -c just mutants-gate

  cov:
    name: coverage gate
    needs: dev-shell
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/dev-shell
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: nix develop -c just cov
