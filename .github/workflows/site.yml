name: Project website

on:
  push:
    branches: [master]
    paths:
      - ".github/actions/dev-shell/**"
      - ".github/workflows/site.yml"
      - "docs/brand/**"
      - "flake.lock"
      - "flake.nix"
      - "justfile"
      - "ui/bun.lock"
      - "ui/bun.nix"
      - "ui/package.json"
      - "ui/packages/kit/**"
      - "ui/packages/site/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/dev-shell
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          rust: "false"
      - run: nix develop -c just build-site
        env:
          OMFP_SITE_VIDEO_URL: ${{ vars.OMFP_SITE_VIDEO_URL }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ui/packages/site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
