[workspace]
resolver = "3"
members = ["crates/*", "xtask", "e2e"]

[workspace.package]
version = "0.2.1"
edition = "2024"
rust-version = "1.99"
publish = false
license = "GPL-3.0-or-later"

[workspace.dependencies]
# Internal crates
omfp-core = { path = "crates/omfp-core" }
omfp-protocol = { path = "crates/omfp-protocol" }
omfp-daemon = { path = "crates/omfp-daemon" }
fake-llm = { path = "crates/fake-llm" }
omfp-testkit = { path = "crates/omfp-testkit" }

# omp RPC client: the tag MUST match the oh-my-pi flake input and omfp_core::OMP_VERSION (ENV-010).
omp-rpc = { git = "https://github.com/can1357/oh-my-pi", tag = "v18.18.6" }

# E2E browser driver
thirtyfour = "0.38"

anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
# File contents (DMN-089): images in base64, hashes in SHA-1; both already in the tree through axum.
base64 = "0.22"
clap = { version = "4", features = ["derive", "string"] }
futures = "0.3"
getrandom = "0.4"
hex = "0.4"
# `Last-Modified` and `If-Modified-Since` of raw workspace files (DMN-253); already in the tree through hyper.
httpdate = "1"
# Cron schedules of declared jobs in the host's local time zone, across daylight-saving changes (DMN-323): its time
# zones read the system's tz database (MIT OR Unlicense).
jiff = "0.2"
insta = { version = "1", features = ["json"] }
# Widget modules (DMN-084, DMN-085): TypeScript/JSX → ES modules, checked imports; oxc pinned as validated in S-12.
oxc_allocator = "=0.158.0"
oxc_codegen = "=0.158.0"
oxc_diagnostics = "=0.158.0"
oxc_parser = "=0.158.0"
oxc_semantic = "=0.158.0"
oxc_span = "=0.158.0"
oxc_syntax = "=0.158.0"
oxc_transformer = "=0.158.0"
proptest = "1"
regex = "1"
portable-pty = "0.9"
# Parses PTY output into the bounded plain-text screen agents inspect (TRM-106).
vt100 = "0.18"
reqwest = { version = "0.13", default-features = false, features = [
  "json",
  "stream",
] }
rusqlite = { version = "0.41", features = ["bundled"] }
# Signals the process group of a job without `unsafe` (DMN-081); already in the tree through tempfile.
rustix = { version = "1", features = ["process"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
subtle = "2"
tempfile = "3"
# Desktop window (M7, D-15, S-04): Tauri 2 on WebKitGTK 4.1, behind `omfp`'s `desktop` feature. No bundled assets,
# no IPC: the window loads the daemon's own UI over http. `custom-protocol` is Tauri's production mode (no dev URL).
tauri = { version = "2.12", default-features = false, features = [
  "wry",
  "custom-protocol",
] }
# Tauri's build step has its own version line (2.7.x).
tauri-build = { version = "2.7", default-features = false }
# The desktop window's color scheme from the settings portal over D-Bus (UI-195): gtk-rs's gio, the version Tauri's
# GTK3 stack already builds (no zbus).
gio = "0.18"
# macOS desktop (M11): posts the window's notifications (UI-252) with Foundation's `NSUserNotificationCenter`,
# registers the app icon (UI-222) with AppKit's `NSImage`, reads the system accent (UI-512) with `NSColor` and finds
# the window's WebKit storage under `NSHomeDirectory` (UI-250); the versions wry already builds, only the classes we
# call.
objc2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
  "std",
  "NSColor",
  "NSColorSpace",
  "NSImage",
  "objc2-core-foundation",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
  "std",
  "NSData",
  "NSPathUtilities",
  "NSString",
  "NSUserNotification",
] }
# The daemon's tray pixmaps (UI-219): build.rs decodes the PNGs rendered from icons/icon.html; the same png Tauri's
# codegen already builds.
png = "0.18"
thiserror = "2"
tokio = { version = "1", features = [
  "macros",
  "rt-multi-thread",
  "net",
  "sync",
  "time",
  "io-util",
  "process",
  "signal",
] }
tokio-tungstenite = "0.30"
toml = "1"
# Config file write-back keeping comments (DMN-009); already in the tree through proc-macro-crate.
toml_edit = "0.25"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ulid = { version = "3", features = ["serde"] }
walkdir = "2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
similar_names = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
