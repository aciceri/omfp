[package]
name = "omfp"
description = "The `omfp` binary (D-15): `omfp daemon` runs the daemon, `omfp theme set` sets the UI theme, `omfp desktop` opens a desktop window."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# The command line's library: the protocol client and the subcommands, used by the binary and its tests.
[lib]
name = "omfp"
path = "src/lib.rs"

# The single binary (D-15).
[[bin]]
name = "omfp"
path = "src/main.rs"
doc = false

[features]
# `omfp desktop` (M7): links WebKitGTK (Linux) or WKWebView (macOS, M11) through Tauri; daemon-only builds leave it
# off. Also `omfp daemon --tray`.
desktop = [
  "dep:tauri",
  "dep:tauri-build",
  "dep:gio",
  "dep:webkit2gtk",
  "dep:objc2",
  "dep:objc2-app-kit",
  "dep:objc2-foundation",
  "dep:png",
  "dep:rusqlite",
]

[dependencies]
anyhow.workspace = true
clap.workspace = true
futures.workspace = true
omfp-core.workspace = true
omfp-daemon.workspace = true
omfp-protocol.workspace = true
serde_json.workspace = true
tauri = { workspace = true, optional = true }
tokio.workspace = true
tokio-tungstenite.workspace = true

# Linux: the settings portal's colour scheme and the status notifier tray over gio's D-Bus API; the page zoom of the
# window through its WebKitGTK web view (UI-283).
[target.'cfg(target_os = "linux")'.dependencies]
gio = { workspace = true, optional = true }
webkit2gtk = { workspace = true, optional = true }
# The binary's allocator (DMN-366): jemalloc with its background threads gives freed memory back to the system while
# the daemon idles; glibc's malloc keeps it in its arenas.
tikv-jemallocator.workspace = true

# macOS (M11, S-15): the menu bar item through Tauri's tray (tray-icon, AppKit's NSStatusItem); the page's
# notifications through Foundation's user notification center (UI-252); the app icon through AppKit (UI-222); the wait
# for WebKit's `localStorage` commit at exit through SQLite (UI-250, the daemon's rusqlite).
[target.'cfg(target_os = "macos")'.dependencies]
tauri = { workspace = true, optional = true, features = ["tray-icon"] }
objc2 = { workspace = true, optional = true }
objc2-app-kit = { workspace = true, optional = true }
objc2-foundation = { workspace = true, optional = true }
rusqlite = { workspace = true, optional = true }

[build-dependencies]
png = { workspace = true, optional = true }
tauri-build = { workspace = true, optional = true }

[dev-dependencies]
rustix.workspace = true
rusqlite.workspace = true
tempfile.workspace = true

[lints]
workspace = true
